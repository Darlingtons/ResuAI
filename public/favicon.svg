<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Define gradients matching the design system -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sparkle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <!-- Background glow / rounded container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#primary-grad)" />
  
  <!-- Stylized Document Page -->
  <rect x="128" y="112" width="256" height="288" rx="24" fill="#ffffff" opacity="0.95" />
  
  <!-- Text lines representing a resume -->
  <rect x="168" y="160" width="128" height="20" rx="10" fill="#cbd5e1" />
  <rect x="168" y="208" width="176" height="14" rx="7" fill="#e2e8f0" />
  <rect x="168" y="246" width="144" height="14" rx="7" fill="#e2e8f0" />
  <rect x="168" y="284" width="160" height="14" rx="7" fill="#e2e8f0" />
  <rect x="168" y="322" width="112" height="14" rx="7" fill="#e2e8f0" />

  <!-- Glowing AI Sparkle/Star in top-right of page -->
  <path d="M376 136 c-8 16 -16 24 -32 32 c16 8 24 16 32 32 c8 -16 16 -24 32 -32 c-16 -8 -24 -16 -32 -32 Z" fill="url(#sparkle-grad)" />
  <path d="M344 96 c-4 8 -8 12 -16 16 c8 4 12 8 16 16 c4 -8 8 -12 16 -16 c-8 -4 -12 -8 -16 -16 Z" fill="url(#sparkle-grad)" />
</svg>